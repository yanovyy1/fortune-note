<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fortune Note — карта мира</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:ital,wght@0,100..900;1,100..900&family=Geist+Mono:ital,wght@0,100..900;1,100..900&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="splash">
  <div class="splash-title">Fortune Note</div>
  <div class="splash-divider">
    <span></span>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6 1l5 5-5 5-5-5z"/></svg>
    <span></span>
  </div>
  <button id="btn-begin" class="btn btn-primary splash-btn">Начать путешествие</button>
</div>

<div id="map"></div>
<div id="markers" class="markers"></div>
<div id="loc-popup" class="loc-popup" hidden>
  <button class="loc-popup-close" aria-label="Закрыть"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
  <div class="loc-popup-body"></div>
</div>
<div id="map-placeholder" class="map-placeholder" role="status" hidden>карта не загрузилась — проверьте assets/map/ и js/map-config.js</div>

<div class="rail">
  <div class="rail-logo">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14"/></svg>
  </div>
  <div class="rail-group">
    <button class="rail-icon" id="btn-search" title="Поиск" aria-label="Поиск">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M17 10.5a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0zM15.1 15.1L21 21"/></svg>
    </button>
    <button class="rail-icon" id="btn-layers" title="Слои" aria-label="Слои">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5zM3 12l9 5 9-5M3 16l9 5 9-5"/></svg>
    </button>
  </div>
  <div class="rail-spacer"></div>
  <button class="rail-icon" id="btn-fullscreen" title="Во весь экран" aria-label="Во весь экран">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
  </button>
</div>

<div class="search-overlay" id="search-overlay">
  <div class="search-box">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M17 10.5a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0zM15.1 15.1L21 21"/></svg>
    <input id="search-input" type="text" placeholder="Найти место…" autocomplete="off">
  </div>
  <div id="search-results" class="search-results"></div>
</div>

<div class="layers-panel" id="layers-panel">
  <div class="title">Слои</div>
  <div class="rows" id="layer-rows"></div>
</div>

<div class="zoom-controls">
  <button id="zoom-in" aria-label="Приблизить">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M12 4v16M4 12h16"/></svg>
  </button>
  <button id="zoom-out" aria-label="Отдалить">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter" aria-hidden="true"><path d="M4 12h16"/></svg>
  </button>
</div>


<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
  }
}
</script>
<script src="js/map-config.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
